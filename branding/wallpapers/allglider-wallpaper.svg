<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#172230"/>
      <stop offset="55%" stop-color="#0d131c"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>
    <linearGradient id="gearGrad" x1="0" y1="8" x2="0" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2cf78"/>
      <stop offset="55%" stop-color="#c8913a"/>
      <stop offset="100%" stop-color="#7a5218"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="66" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8cbc4a"/>
      <stop offset="100%" stop-color="#4f7a26"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="66" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8eef3"/>
      <stop offset="100%" stop-color="#6e7a86"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark Low-Glare Gaming Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Subtle Cybernetic Grid & Circuit Lines -->
  <g stroke="#38d6e8" stroke-width="2" opacity="0.14" fill="none">
