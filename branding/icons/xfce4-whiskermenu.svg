<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 196 196" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="34" x2="0" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140c38"/>
      <stop offset="42%" stop-color="#551c5c"/>
      <stop offset="70%" stop-color="#c0402c"/>
      <stop offset="100%" stop-color="#f4a43a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="96" x2="0" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4a8"/>
      <stop offset="50%" stop-color="#ffb238"/>
      <stop offset="100%" stop-color="#ff522c"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="-26" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a2214"/>
      <stop offset="100%" stop-color="#0c0604"/>
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="128" cy="128" r="98"/>
    </clipPath>
  </defs>
  <!-- Inner Disc -->
  <circle cx="128" cy="128" r="98" fill="#1c1004"/>
  <g clip-path="url(#discClip)">
    <!-- Sky -->
    <rect x="0" y="0" width="256" height="256" fill="url(#skyGrad)"/>
    <!-- Stars -->
    <circle cx="78" cy="62" r="1.6" fill="rgba(255,255,255,0.75)"/>
    <circle cx="170" cy="54" r="1.6" fill="rgba(255,255,255,0.75)"/>
    <circle cx="196" cy="88" r="1.6" fill="rgba(255,255,255,0.75)"/>
    <circle cx="104" cy="78" r="1.6" fill="rgba(255,255,255,0.75)"/>
    <!-- Sun -->
    <circle cx="128" cy="150" r="54" fill="url(#sunGrad)"/>
    <rect x="68" y="154" width="120" height="2.5" fill="url(#skyGrad)"/>
    <rect x="68" y="165" width="120" height="3.5" fill="url(#skyGrad)"/>
    <rect x="68" y="177" width="120" height="4.8" fill="url(#skyGrad)"/>
    <rect x="68" y="190" width="120" height="6.1" fill="url(#skyGrad)"/>
    <!-- Far mountains -->
    <polygon points="0,186 34,164 62,178 96,150 124,176 160,156 196,178 226,160 256,174 256,256 0,256" fill="#3a143a"/>
    <!-- Near mountains -->
    <polygon points="0,204 46,180 80,196 118,174 150,198 188,180 222,200 256,186 256,256 0,256" fill="#140814"/>
    <!-- Glider -->
    <g transform="translate(126, 108) rotate(-13)">
      <path d="M 0,-26 L 90,16 Q 42,2 0,8 Q -42,2 -90,16 Z" fill="url(#wingGrad)" stroke="#080402" stroke-width="3"/>
      <line x1="0" y1="-24" x2="86" y2="14" stroke="#f2c862" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-24" x2="-86" y2="14" stroke="#f2c862" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="0" y2="6" stroke="#f2c862" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
