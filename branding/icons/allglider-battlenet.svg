<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022144"/>
      <stop offset="50%" stop-color="#04396c"/>
      <stop offset="100%" stop-color="#07508f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="40" x2="256" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38d6ff"/>
      <stop offset="60%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0072de"/>
    </linearGradient>
    <filter id="bnetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base Disc -->
  <circle cx="128" cy="128" r="118" fill="url(#bgGrad)" stroke="#1a6bb5" stroke-width="4"/>
  <!-- Outer thin ring -->
  <circle cx="128" cy="128" r="106" fill="none" stroke="#2282d4" stroke-width="2" opacity="0.6"/>
  <!-- Battle.net Swirl Nodes -->
  <g filter="url(#bnetGlow)" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center connecting core -->
    <circle cx="128" cy="128" r="16" fill="url(#glowGrad)" stroke="none"/>
    <!-- Outer branch 1 -->
    <path d="M 128,128 C 110,95 85,78 58,82 C 42,84 35,98 42,112 C 55,138 92,136 128,128 Z"/>
    <!-- Outer branch 2 -->
    <path d="M 128,128 C 158,110 185,115 198,138 C 206,152 198,168 182,168 C 152,168 135,145 128,128 Z"/>
    <!-- Outer branch 3 -->
    <path d="M 128,128 C 120,162 108,188 88,196 C 72,202 58,190 62,174 C 70,146 102,135 128,128 Z"/>
  </g>
  <!-- Node light accents -->
  <circle cx="48" cy="98" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="190" cy="148" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="74" cy="182" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="128" cy="128" r="7" fill="#ffffff" opacity="0.95"/>
</svg>
