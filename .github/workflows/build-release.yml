name: Build & Release AllGlider Live ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (leave empty to auto-increment patch version)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Live ISO & Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on runner
        run: |
          echo "Initial disk space:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          echo "Cleaned disk space:"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman \
            xorriso \
            mtools \
            dosfstools \
            curl \
            jq \
            ca-certificates
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Increment version & configure release tag
        id: version_bump
        run: |
          chmod +x scripts/*.sh scripts/*.py installer/migration/*.sh installer/first-boot-restore/*.py installer/ui/*.py
          
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            # Explicit custom tag provided
            ./scripts/bump-version.sh "${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Triggered by git tag push
            TAG_VER="${GITHUB_REF#refs/tags/}"
            ./scripts/bump-version.sh "${TAG_VER#v}"
          else
            # Default workflow run: increment patch version (e.g. 0.1.0 -> 0.1.1)
            ./scripts/bump-version.sh
          fi

          source config/versions.lock
          TAG="v${ALLGLIDER_DISTRO_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "distro_ver=$ALLGLIDER_DISTRO_VERSION" >> "$GITHUB_OUTPUT"
          echo "ag_ver=$ALLGLIDER_VERSION" >> "$GITHUB_OUTPUT"
          echo "proton_ver=$PROTON_VERSION" >> "$GITHUB_OUTPUT"
          echo "wb_ver=$WINBRIDGE_VERSION" >> "$GITHUB_OUTPUT"

          # Push bumped version back to repository if not running on a detached tag
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION config/versions.lock
            if ! git diff --staged --quiet; then
              git commit -m "chore(release): bump distro version to ${TAG} [skip ci]"
              git push origin HEAD:${{ github.ref_name }} 2>/dev/null || true
            fi
          fi

      - name: Verify repository scripts & syntax
        run: |
          ./scripts/verify-image.sh

      - name: Build AllGlider Live ISO (Fedora 44 container)
        run: |
          ./scripts/build-iso.sh --container

      - name: Prepare Release Artifacts (Split ISO for GitHub Release)
        run: |
          ls -lh build/
          ISO_FILE=$(ls build/*.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ] || [ ! -f "$ISO_FILE" ]; then
            echo "ERROR: ISO file was not generated in build/!" >&2
            exit 1
          fi
          ISO_BASENAME="$(basename "$ISO_FILE")"
          echo "Processing $ISO_BASENAME ($(du -h "$ISO_FILE" | cut -f1))"

          # Generate SHA256 of the complete unified ISO
          (cd build && sha256sum "$ISO_BASENAME" > "${ISO_BASENAME}.sha256")
          cat "build/${ISO_BASENAME}.sha256"

          # GitHub Releases enforces a strict 2.0 GiB (2,147,483,648 bytes) per-file limit.
          # Split the ISO into <= 1900MB parts (.001, .002, ...)
          split -d -a 3 --numeric-suffixes=1 -b 1900M "$ISO_FILE" "build/${ISO_BASENAME}."

          # Compute the join command for Windows copy /b
          JOIN_CMD="copy /b"
          FIRST=1
          for part in $(ls build/${ISO_BASENAME}.0*); do
            BN=$(basename "$part")
            if [ $FIRST -eq 1 ]; then
              JOIN_CMD="$JOIN_CMD \"$BN\""
              FIRST=0
            else
              JOIN_CMD="$JOIN_CMD + \"$BN\""
            fi
          done
          JOIN_CMD="$JOIN_CMD \"${ISO_BASENAME}\""

          cat > build/join-iso.bat << EOF
@echo off
setlocal
title AllGlider Live ISO Reassembler
echo ========================================================
echo  AllGlider Live Linux - ISO Reassembler
echo ========================================================
echo.
echo Merging ISO chunks into ${ISO_BASENAME}...
$JOIN_CMD
if not exist "${ISO_BASENAME}" (
    echo.
    echo ERROR: Failed to merge ISO chunks!
    pause
    exit /b 1
)
echo.
echo Calculating SHA-256 checksum...
certutil -hashfile "${ISO_BASENAME}" SHA256
echo.
echo Success! ${ISO_BASENAME} is ready to flash with Rufus or BalenaEtcher.
echo ========================================================
pause
EOF
          sed -i 's/$/\r/' build/join-iso.bat

          cat > build/join-iso.sh << EOF
#!/usr/bin/env bash
set -euo pipefail
echo "=== AllGlider Live Linux - ISO Reassembler ==="
echo "Merging ISO chunks into ${ISO_BASENAME}..."
cat "${ISO_BASENAME}".0* > "${ISO_BASENAME}"
echo "Verifying SHA-256 checksum..."
sha256sum -c "${ISO_BASENAME}.sha256"
echo "=== Success! ${ISO_BASENAME} is ready to flash with Rufus or BalenaEtcher ==="
EOF
          chmod +x build/join-iso.sh

          # Remove the oversized single ISO file so it does not trigger GitHub's 2GB upload limit
          rm -f "$ISO_FILE"

          ls -lh build/

      - name: Create GitHub Release & Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_bump.outputs.tag }}
        run: |
          EXTRA_FLAGS=()
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            EXTRA_FLAGS+=("--draft")
          fi
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          NOTES=$(cat << 'EOF'
          # AllGlider Live Linux – ${{ steps.version_bump.outputs.tag }}

          Official bootable Live USB image for AllGlider on modern PC gaming hardware.

          ### Included Components & Versions
          - **AllGlider Distro Version:** ${{ steps.version_bump.outputs.distro_ver }}
          - **AllGlider App:** ${{ steps.version_bump.outputs.ag_ver }} (dynamically fetched from allglider.com)
          - **Base System:** Fedora Linux 44 (x86_64) + Xfce 4.20 Desktop
          - **Graphics Support:** Out-of-the-box NVIDIA (Proprietary Drivers) + AMD Radeon & Intel Mesa/Vulkan
          - **Wine/Proton Engine:** ${{ steps.version_bump.outputs.proton_ver }} + UMU Launcher
          - **Host Storage Scanner:** Automatic detection of Battle.net & World of Warcraft on host disks (with BitLocker / encryption alerts)
          - **Persistence Support:** Auto-mounting persistent USB storage (`ALLGLIDER_DATA`)

          ### How to Assemble & Flash the ISO
          Because GitHub Releases enforces a strict 2.0 GB per-file upload limit, the full Live ISO is split into 1.9 GB chunks (`.iso.001`, `.iso.002`, ...).

          **To reassemble into the full bootable ISO:**
          - **Windows (Recommended):** Download all `.iso.001`, `.iso.002`, ... parts and `join-iso.bat` into the same folder, then double-click `join-iso.bat`.
          - **Windows / 7-Zip:** Right-click the `.iso.001` file in 7-Zip or WinRAR and choose **Extract Here** (or Combine files).
          - **Linux / macOS:** Download all parts and run:
            ```bash
            cat AllGlider-Live-*.iso.0* > AllGlider-Live.iso
            sha256sum -c AllGlider-Live-*.iso.sha256
            ```

          Once merged, flash the resulting `.iso` file to an 8 GB+ USB stick using [Rufus](https://rufus.ie/) (Windows) or [BalenaEtcher](https://etcher.balena.io/) (Windows/Mac/Linux).
          EOF
          )

          gh release create "$TAG" \
            build/*.0* \
            build/*.sha256 \
            build/join-iso.bat \
            build/join-iso.sh \
            --title "AllGlider Live Linux ${TAG}" \
            --notes "$NOTES" \
            "${EXTRA_FLAGS[@]}"
